name: Sync installer to website

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - contrib/install/**
      - .github/workflows/sync-installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-installer
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'zelport/zelport' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Queued and manually rerun jobs must never restore an older installer.
          ref: main
          persist-credentials: false
          path: source

      - name: Validate installer
        working-directory: source
        run: |
          bash -n install.sh
          python3 -m unittest discover -s contrib/install -p test_install.py

      - name: Create website installation token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.INSTALLER_SYNC_APP_ID }}
          private-key: ${{ secrets.INSTALLER_SYNC_PRIVATE_KEY }}
          owner: zelport
          repositories: zelport-web
          permission-contents: write

      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zelport/zelport-web
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: website

      - name: Synchronize installer
        shell: bash
        run: |
          set -euo pipefail
          if cmp -s source/install.sh website/install.sh; then
            echo "Installer already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp source/install.sh website/install.sh
          git -C website config user.name zdeneksvarc
          git -C website config user.email 79550344+zdeneksvarc@users.noreply.github.com
          git -C website add -- install.sh
          git -C website commit -m "chore: initialize preview"
          git -C website push origin HEAD:main
          sha256sum source/install.sh website/install.sh >> "$GITHUB_STEP_SUMMARY"
